name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: catem_app

jobs:
  analyze_and_test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verificar que el codigo generado este al dia
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart' '*.freezed.dart' \
            || (echo "::error::Hay *.g.dart desactualizados; corre build_runner y commitea" && exit 1)

      - run: flutter analyze --fatal-infos

      - run: flutter test --coverage

      - name: Cobertura minima 70% en domain y data (RNF-11)
        run: python3 tool/check_coverage.py coverage/lcov.info --min 70

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: catem_app/coverage/lcov.info

  build_android:
    name: Build Android
    needs: analyze_and_test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Firma de release: si los secrets existen se usa el keystore real; si no, el de debug.
      - name: Configurar keystore de firma
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - run: flutter build appbundle --release --dart-define=ENV=prod

      - uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: catem_app/build/app/outputs/bundle/release/*.aab

  build_ios:
    name: Build iOS
    needs: analyze_and_test
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Sin firma hasta tener certificados de Apple Developer (ver CATEM-17 en Plane).
      - run: flutter build ios --release --no-codesign --dart-define=ENV=prod
